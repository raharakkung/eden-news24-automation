name: Daily Publish to Blogger

on:
  schedule:
    # 매일 00:00 UTC = 한국시간(KST) 오전 9시
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate & publish today's articles
        working-directory: scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          POSTS_PER_DAY: "5"
        run: python publish_to_blogger.py

      - name: Commit updated topic history
        run: |
          git config user.name "eden-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/used_topics.json data/category_cursor.json
          git diff --cached --quiet || git commit -m "chore: 사용한 주제 기록 업데이트 [skip ci]"
          git push
